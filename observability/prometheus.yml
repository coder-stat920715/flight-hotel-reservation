global:
  scrape_interval: 15s
scrape_configs:
  - job_name: spring-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080   # api-gateway
          - host.docker.internal:8081   # booking-command-service
          - host.docker.internal:8082   # flight-hotel-query-service
          - host.docker.internal:8083   # payment-saga-service
          - host.docker.internal:8761   # discovery-server
          - host.docker.internal:8888   # config-server
  # In Kubernetes use kubernetes_sd_configs with the prometheus.io/* pod annotations (port 9090).
