# Layer 2 - INTERNAL L7 load balancer (internal-scheme ALB in the private app subnets) for service-to-service traffic
# that must leave the pod network (e.g. from other VPCs/accounts over TGW). In-cluster calls keep using Eureka +
# client-side load balancing and mTLS. For a full service mesh swap this for Istio/Linkerd (mTLS + L7 routing).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internal-services
  namespace: travel-platform
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: ${INTERNAL_CERT_ARN}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-port: "9090"
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
spec:
  ingressClassName: alb
  rules:
    - host: internal.${APP_DOMAIN}
      http:
        paths:
          - path: /api/v1/bookings
            pathType: Prefix
            backend:
              service:
                name: booking-command-service
                port:
                  number: 8081
          - path: /api/v1/travel
            pathType: Prefix
            backend:
              service:
                name: flight-hotel-query-service
                port:
                  number: 8082
