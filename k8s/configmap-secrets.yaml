# Apply with:  envsubst < k8s/configmap-secrets.yaml | kubectl apply -f -
# (values come from `terraform output`; in production source the Secret from AWS Secrets Manager via External Secrets.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: travel-platform
data:
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka
  KAFKA_BOOTSTRAP: ${MSK_BOOTSTRAP}
  REDIS_HOST: ${REDIS_ENDPOINT}
  REDIS_PORT: "6379"
  DB_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/travel
  JWT_ISSUER_URI: ${JWT_ISSUER_URI}
  OTLP_ENDPOINT: http://otel-collector.observability:4318/v1/traces
  CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
  PAYMENT_SIMULATE: "false"
  PAYMENT_GATEWAY_URL: https://payments.internal.example.com
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: travel-platform
type: Opaque
stringData:
  DB_USER: travel_app
  DB_PASSWORD: ${DB_PASSWORD}
